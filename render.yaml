\services:
  - type: web
    name: malixaris-nftoken-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: GUILD_ID
        sync: false
      - key: ALLOWED_ROLE_IDS
        sync: false
      - key: ADMIN_BYPASS
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.9
